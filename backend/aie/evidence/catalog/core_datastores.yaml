# Technology catalog: core data stores
# Each entry: package/image/port signals -> role(s) + layer

technologies:
  - id: redis
    display_name: Redis
    layer: data
    possible_roles:
      - cache
      - rate_limit_store
      - job_queue
      - session_store
    match:
      packages: [redis, aioredis, redis-py, hiredis]
      images: [redis, bitnami/redis]
      ports: [6379]
      env_keys: [REDIS_URL, REDIS_HOST, CACHE_URL]

  - id: postgresql
    display_name: PostgreSQL
    layer: data
    possible_roles: [primary_database, analytics_store]
    match:
      packages: [psycopg2, psycopg, asyncpg, psycopg2-binary, sqlalchemy, databases]
      images: [postgres, bitnami/postgresql, supabase/postgres]
      ports: [5432]
      env_keys: [DATABASE_URL, POSTGRES_URL, DB_HOST, POSTGRES_HOST]

  - id: mysql
    display_name: MySQL
    layer: data
    possible_roles: [primary_database]
    match:
      packages: [mysqlclient, pymysql, aiomysql, mysql-connector-python]
      images: [mysql, mariadb, bitnami/mysql]
      ports: [3306]
      env_keys: [DATABASE_URL, MYSQL_HOST, DB_HOST]

  - id: mongodb
    display_name: MongoDB
    layer: data
    possible_roles: [document_store, primary_database]
    match:
      packages: [pymongo, motor, beanie, mongoengine]
      images: [mongo, bitnami/mongodb]
      ports: [27017]
      env_keys: [MONGODB_URL, MONGO_URI, MONGO_HOST]

  - id: sqlite
    display_name: SQLite
    layer: data
    possible_roles: [embedded_database, local_store]
    match:
      packages: [aiosqlite]
      images: []
      ports: []
      env_keys: [DATABASE_URL, SQLITE_PATH]
