# Technology catalog: AI, ML, embeddings

technologies:
  - id: langchain
    display_name: LangChain
    layer: ai
    possible_roles: [llm_orchestrator, chain_runner]
    match:
      packages: [langchain, langchain-core, langchain-community, langchain-openai]
      images: []
      ports: []
      env_keys: [LANGCHAIN_API_KEY, LANGCHAIN_TRACING_V2]

  - id: langgraph
    display_name: LangGraph
    layer: ai
    possible_roles: [agent_orchestrator, workflow_engine]
    match:
      packages: [langgraph]
      images: []
      ports: []
      env_keys: []

  - id: openai
    display_name: OpenAI
    layer: ai
    possible_roles: [llm_client, embedding_provider]
    match:
      packages: [openai]
      images: []
      ports: []
      env_keys: [OPENAI_API_KEY]

  - id: anthropic
    display_name: Anthropic Claude
    layer: ai
    possible_roles: [llm_client]
    match:
      packages: [anthropic]
      images: []
      ports: []
      env_keys: [ANTHROPIC_API_KEY]

  - id: groq
    display_name: Groq
    layer: ai
    possible_roles: [llm_client]
    match:
      packages: [groq]
      images: []
      ports: []
      env_keys: [GROQ_API_KEY]

  - id: chromadb
    display_name: ChromaDB
    layer: data
    possible_roles: [vector_store, embedding_index]
    match:
      packages: [chromadb, chroma-hnswlib]
      images: [ghcr.io/chroma-core/chroma]
      ports: [8000]
      env_keys: [CHROMA_HOST, CHROMA_PORT]

  - id: pinecone
    display_name: Pinecone
    layer: data
    possible_roles: [vector_store]
    match:
      packages: [pinecone-client, pinecone]
      images: []
      ports: []
      env_keys: [PINECONE_API_KEY, PINECONE_INDEX]

  - id: faiss
    display_name: FAISS
    layer: data
    possible_roles: [vector_store, similarity_index]
    match:
      packages: [faiss-cpu, faiss-gpu, faiss]
      images: []
      ports: []
      env_keys: []
