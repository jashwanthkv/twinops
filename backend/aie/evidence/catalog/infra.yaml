# Technology catalog: infrastructure / platform

technologies:
  - id: nginx
    display_name: NGINX
    layer: edge
    possible_roles: [load_balancer, reverse_proxy, ingress]
    match:
      packages: []
      images: [nginx, nginx:alpine, bitnami/nginx]
      ports: [80, 443, 8080]
      env_keys: [NGINX_HOST, NGINX_PORT]

  - id: traefik
    display_name: Traefik
    layer: edge
    possible_roles: [load_balancer, reverse_proxy, ingress]
    match:
      packages: []
      images: [traefik]
      ports: [80, 443, 8080]
      env_keys: []

  - id: prometheus
    display_name: Prometheus
    layer: observability
    possible_roles: [metrics_collector]
    match:
      packages: [prometheus-client, prometheus_client]
      images: [prom/prometheus, bitnami/prometheus]
      ports: [9090]
      env_keys: [PROMETHEUS_PORT, METRICS_PORT]

  - id: grafana
    display_name: Grafana
    layer: observability
    possible_roles: [metrics_dashboard]
    match:
      packages: []
      images: [grafana/grafana, bitnami/grafana]
      ports: [3000]
      env_keys: [GRAFANA_PORT]
